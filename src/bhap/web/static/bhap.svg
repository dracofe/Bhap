<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 11 10" shape-rendering="crispEdges">
  <title>Bhap</title>
  <rect x="-1" y="-1" width="11" height="10" rx="2.2" fill="#12201f"/>
  <g fill="#4fb3a9">
    <!-- ears -->
    <rect x="0" y="1" width="1" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/>
    <rect x="6" y="1" width="1" height="1"/><rect x="7" y="0" width="1" height="1"/><rect x="8" y="1" width="1" height="1"/>
    <!-- face sides -->
    <rect x="0" y="2" width="1" height="4"/><rect x="8" y="2" width="1" height="4"/>
    <!-- beak + mouth -->
    <rect x="4" y="3" width="1" height="1"/><rect x="3" y="4" width="3" height="1"/>
    <!-- feet -->
    <rect x="1" y="6" width="2" height="1"/><rect x="3" y="7" width="1" height="1"/>
    <rect x="5" y="7" width="1" height="1"/><rect x="6" y="6" width="2" height="1"/>
  </g>
  <g fill="none" stroke="#4fb3a9" stroke-width="0.32" shape-rendering="geometricPrecision">
    <circle cx="2.5" cy="2.6" r="0.62"/><circle cx="6.5" cy="2.6" r="0.62"/>
  </g>
  <g fill="#e0a458" shape-rendering="geometricPrecision">
    <circle cx="2.5" cy="2.6" r="0.24"/><circle cx="6.5" cy="2.6" r="0.24"/>
  </g>
</svg>
